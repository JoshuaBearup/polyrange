dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = 127.0.0.1
auth_allow_cleartext = yes
auth_mechanisms = plain login

mail_home = /srv/mail/%{user}
mail_driver = maildir
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000

namespace inbox {
  inbox = yes
  separator = .
}

passdb static_auth {
  driver = static
  passdb_static_password = s3cret
}

userdb static_users {
  driver = static
  fields {
    uid = vmail
    gid = vmail
    home = /srv/mail/%{user}
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

log_path = /dev/stderr
info_log_path = /dev/stderr
