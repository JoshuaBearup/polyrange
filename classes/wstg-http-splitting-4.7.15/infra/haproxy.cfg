global
    log stdout local0
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    option  http-buffer-request
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_in
    bind *:8080
    # Strip any client-supplied trusted-upstream header so direct requests
    # cannot forge the marker. The header is re-added on every inbound
    # request below.
    http-request del-header __TRUSTED_HEADER__
    # __TIER1_REJECT_RULE__
    # Add the trusted-upstream marker the backend looks for.
    http-request set-header __TRUSTED_HEADER__ __TRUSTED_VALUE__
    # Forward to the raw-net Node backend on localhost:3000.
    default_backend node_backend

backend node_backend
    option http-server-close
    server node1 127.0.0.1:3000
